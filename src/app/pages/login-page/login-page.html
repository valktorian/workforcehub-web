<section class="login-shell">
  <article class="login-hero">
    <p class="eyebrow">Secure access</p>
    <h2>Welcome back to WorkForceHub.</h2>
    <p>
      Sign in with your workforce account to open your profile, role-aware tools, and employee workspace.
    </p>
  </article>

  <article class="login-card card">
    <div class="login-card__head">
      <p class="eyebrow">Login</p>
      <h1>Sign in</h1>
      <p>Use the credentials managed by the deployed WorkForceHub API.</p>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
      <mix-input
        formControlName="email"
        label="Email"
        placeholder="name@company.com"
        type="email"
        autocomplete="email"
        [required]="true"
      />

      <mix-input
        formControlName="password"
        label="Password"
        placeholder="Enter your password"
        type="password"
        autocomplete="current-password"
        [required]="true"
      />

      @if (error()) {
        <p class="login-error">{{ error() }}</p>
      }

      <button class="login-submit" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          Signing in...
        } @else {
          <mix-icon name="arrow-right-to-bracket-solid-full" [size]="18" ariaLabel="Sign in" />
          Sign in
        }
      </button>
    </form>
  </article>
</section>
